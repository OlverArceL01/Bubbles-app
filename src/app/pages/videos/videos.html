<div class="grid grid-cols-2 md:grid-cols-3 gap-2">
    @for (video of videos; track video) {
    <a 
        [routerLink]="['/video/', video]"
        class="cursor-pointer bg-emerald-400 hover:bg-emerald-200">
        <video [src]="video + '.mp4'"></video>
            <p class="text-center font-bold text-black">{{video}}</p>
    </a>
    }
</div>
